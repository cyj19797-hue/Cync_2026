spring:
  datasource:
    url: jdbc:mysql://cync-mysql-server.mysql.database.azure.com:3306/sejong_app?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true
    username: cyncadmin
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  open-in-view: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 31536000000

azure:
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    container-name: notice-images